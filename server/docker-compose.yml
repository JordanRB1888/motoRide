version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deliveryplus58_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deliveryplus58_secret_password
      POSTGRES_DB: deliveryplus58_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliveryplus58_api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:deliveryplus58_secret_password@postgres:5432/deliveryplus58_db?schema=public"
      JWT_SECRET: "deliveryplus58_jwt_production_secret_key"
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  postgres_data:
