<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="+58express | Tu moto, al instante">
    <meta name="theme-color" content="#0e0d0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>+58express | Tu moto, al instante</title>
    
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-brand-48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-brand-180.png">
    <link rel="manifest" href="/manifest.json">

    <style>
      #app-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 43%,#172234 0,#07101c 34%,#02060d 74%);opacity:1;visibility:visible;transition:opacity .38s ease,visibility .38s ease}
      #app-splash.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
      .app-splash-content{display:grid;place-items:center;text-align:center;transform:translateY(-2vh)}
      .app-splash-orbit{position:relative;width:154px;height:154px;display:grid;place-items:center;border-radius:50%}
      .app-splash-orbit:before,.app-splash-orbit:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
      .app-splash-orbit:before{inset:-9px;border:2px solid rgba(255,196,0,.16);border-top-color:#ffc400;border-right-color:#ffc400;box-shadow:0 0 26px rgba(255,196,0,.18);animation:splashOrbit 1.15s linear infinite}
      .app-splash-orbit:after{inset:-20px;border:1px solid rgba(255,196,0,.1);border-left-color:rgba(255,196,0,.65);animation:splashOrbit 1.8s linear infinite reverse}
      .app-splash-logo{width:138px;height:138px;display:block;border:3px solid #ffc400;border-radius:50%;object-fit:cover;overflow:hidden;background:#050b13;box-shadow:0 0 0 6px rgba(255,196,0,.08),0 18px 45px rgba(0,0,0,.55),0 0 36px rgba(255,196,0,.2);animation:splashLogoTurn 1.35s cubic-bezier(.45,.05,.2,1) infinite}
      .app-splash-name{margin-top:30px;color:#f7f6f3;font:800 1.55rem/1.05 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.06em}
      .app-splash-name b{color:#ffc400}
      .app-splash-status{margin-top:10px;color:#a3a09a;font:650 .68rem/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.08em;text-transform:uppercase}
      .app-splash-dots{height:8px;margin-top:17px;display:flex;align-items:center;gap:6px}
      .app-splash-dots i{width:6px;height:6px;border-radius:50%;background:#ffc400;box-shadow:0 0 9px rgba(255,196,0,.55);animation:splashDot 1s ease-in-out infinite}
      .app-splash-dots i:nth-child(2){animation-delay:.15s}.app-splash-dots i:nth-child(3){animation-delay:.3s}
      @keyframes splashOrbit{to{transform:rotate(360deg)}}
      @keyframes splashLogoTurn{0%{transform:perspective(500px) rotateY(0) scale(.96)}45%{transform:perspective(500px) rotateY(180deg) scale(1.04)}100%{transform:perspective(500px) rotateY(360deg) scale(.96)}}
      @keyframes splashDot{0%,100%{opacity:.28;transform:translateY(0) scale(.75)}50%{opacity:1;transform:translateY(-4px) scale(1)}}
      @media(max-width:390px){.app-splash-orbit{width:136px;height:136px}.app-splash-logo{width:122px;height:122px}.app-splash-name{font-size:1.35rem}}
      @media(prefers-reduced-motion:reduce){.app-splash-orbit:before,.app-splash-orbit:after,.app-splash-logo,.app-splash-dots i{animation:none}.app-splash-logo{transform:none}}
    </style>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Cargando +58 Express">
      <div class="app-splash-content">
        <div class="app-splash-orbit">
          <img class="app-splash-logo" src="/app-icon-brand-512.png" alt="Logo +58 Express">
        </div>
        <div class="app-splash-name"><b>+58</b>express</div>
        <div class="app-splash-status">Preparando tu viaje</div>
        <div class="app-splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>window.__APP_SPLASH_STARTED_AT__=performance.now();</script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(reg => console.log('[PWA] Service Worker registrado', reg.scope))
            .catch(err => console.log('[PWA] Error Service Worker', err));
        });
      }
    </script>
</body>
</html>
