<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Cyan Speed Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Glowing Drop Shadows -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M256 32 L432 96 V240 C432 352 352 448 256 480 C160 448 80 352 80 240 V96 Z" 
        fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glowGold)"/>

  <!-- Inner Hexagon Ring -->
  <path d="M256 64 L400 116 V230 C400 326 332 412 256 440 C180 412 112 326 112 230 V116 Z" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Speed Motion Trails -->
  <path d="M120 280 L220 200 H360" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)"/>
  <path d="M140 320 L240 240 H380" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glowGold)"/>

  <!-- Stylized +58 Country Code & Motorcycle -->
  <g transform="translate(110, 165)">
    <!-- Plus Sign (+) -->
    <path d="M20 50 V90 M0 70 H40" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glowGold)"/>

    <!-- Number 5 -->
    <path d="M90 45 H130 M90 45 V70 H120 C132 70 135 95 120 100 H85" 
          fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGold)"/>

    <!-- Number 8 -->
    <path d="M175 60 C165 40 195 40 185 60 C170 85 200 85 185 102 C170 115 155 95 175 60 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glowGold)"/>
  </g>

  <!-- Futuristic Motorcycle Rider Silhouette -->
  <g transform="translate(195, 170)" filter="url(#glowGold)">
    <!-- Wheels -->
    <circle cx="50" cy="120" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
    <circle cx="170" cy="120" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
    <circle cx="50" cy="120" r="14" fill="url(#cyanGrad)"/>
    <circle cx="170" cy="120" r="14" fill="url(#cyanGrad)"/>

    <!-- Frame & Body -->
    <path d="M50 120 L90 80 H140 L170 120 M90 80 L110 120 M140 80 L130 120" 
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rider Silhouette -->
    <path d="M80 70 C80 60 90 50 100 55 L130 65 L110 85 L90 80 Z" fill="url(#goldGrad)"/>
    <!-- Helmet -->
    <circle cx="105" cy="45" r="12" fill="url(#cyanGrad)"/>
  </g>

  <!-- Express Badge Banner -->
  <rect x="156" y="380" width="200" height="36" rx="18" fill="#121824" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="405" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFC107" text-anchor="middle" letter-spacing="4">EXPRESS</text>
</svg>
